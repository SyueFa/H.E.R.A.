name: hera
description: 邊緣運算傷口辨識系統 - App 端
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 拍照 / 相機串流
  camera: ^0.12.0+2

  # YOLO 推論
  ultralytics_yolo: ^0.6.14

  # 純 Dart 影像處理
  image: ^4.2.0

  # 本地資料庫
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # 本機設定
  shared_preferences: ^2.3.2

  # 趨勢折線圖
  fl_chart: ^0.69.0

  # 字體
  google_fonts: ^6.2.1

  # 通知
  flutter_local_notifications: ^17.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/